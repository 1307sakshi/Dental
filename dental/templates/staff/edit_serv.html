<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>aserv</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body>
    <!-- column -->
    <div class="container text-center">
        <div class="row align-items-start">
          <div class="col">
      
            <!-- Form -->
            <h1>Edit the services</h1>
            <form method='post'>
              {% csrf_token %}
              <input type="text" class="form-control visually-hidden " id="name" name="id" value="{{ser.id}}" >
              <div class="mb-3">
                <label for="Name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name='name' aria-describedby="emailHelp" value="{{ser.name}}">
              </div>
            <div class="mb-3">
                <label for="Detail" class="form-label">Detail</label>
                <textarea  class="form-control" id="Detail" name='detail'  aria-describedby="emailHelp"> {{ser.detail}}
               </textarea>
              </div>
            <div class="mb-3">
              <label for="Price " class="form-label">Price </label>
              <input type="text" class="form-control" id="price" name='price' aria-describedby="emailHelp" value ="{{ser.price}}">
            </div>
            <div class="mb-3">
              <label for="Price " class="form-label"> image </label>
              <input type="file" class="form-control" id="piccture" name='piccture' aria-describedby="emailHelp" value ="{{ser.piccture}}">
            </div>
            
            <button type="submit" class="btn btn-primary">Submit</button>

            </form>
        </div>
      </div>
      <!-- cend -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
